<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Quên mã bảo mật — Cổng Tra Cứu Dược</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="login-shell">
  <div class="login-card">
    <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Logo bệnh viện" style="width:72px; height:72px; margin:0 auto 16px; display:block;">
    <h1>Quên mã bảo mật</h1>
    <p class="sub">Nhập email đã đăng ký cho tài khoản quản trị.<br>Chúng tôi sẽ gửi link để đặt mã mới.</p>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
      <div style="margin-bottom:16px;">
        {% for category, message in messages %}
        <div class="flash-msg flash-{{ 'error' if category == 'error' else category }}">{{ message }}</div>
        {% endfor %}
      </div>
      {% endif %}
    {% endwith %}
    <form method="POST" action="{{ url_for('admin_cong.quen_ma') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-row"><label>Email tài khoản quản trị</label><input type="email" name="email" autocomplete="email" required autofocus></div>
      <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center; padding:11px;">Gửi link đặt mã mới</button>
    </form>
    <p style="text-align:center; margin:16px 0 0; font-size:13px;"><a href="{{ url_for('admin_cong.nhap_ma') }}">← Quay lại nhập mã</a></p>
  </div>
</div>
</body>
</html>
