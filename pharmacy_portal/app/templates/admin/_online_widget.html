{# Ô thống kê người đang online (gọn): máy tính = ghim góc dưới phải; điện thoại = nằm cuối trang (xem .online-box trong style.css) #}
<div class="online-box" id="onlineBox" role="status" aria-live="polite">
  <button type="button" class="online-toggle" id="onlineToggle" aria-expanded="false" aria-controls="onlineDetail"
          title="Đang online, cập nhật trực tiếp. Bấm để xem tên admin.">
    <span class="online-dot" aria-hidden="true"></span>
    <span class="online-stat" title="Admin online"><b id="onlineAdmin">–</b> admin</span>
    <span class="online-stat" title="Người dùng online"><b id="onlineKhach">–</b> người dùng</span>
    <svg class="online-chevron" width="9" height="5" viewBox="0 0 10 6" fill="none" aria-hidden="true"><path d="M1 1l4 4 4-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <div class="online-detail" id="onlineDetail" hidden>
    <div class="online-detail-title">Admin đang online</div>
    <ul class="online-names" id="onlineNames"><li>—</li></ul>
  </div>
</div>
