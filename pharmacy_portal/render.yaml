# Cấu hình Render Blueprint (tuỳ chọn) - dùng khi deploy bằng "New +" > "Blueprint"
# Nếu deploy thủ công qua giao diện Render, có thể bỏ qua file này và
# nhập Build/Start command trực tiếp trên dashboard (xem README.md).
services:
  - type: web
    name: pharmacy-portal
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn run:app --bind 0.0.0.0:$PORT"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DB_TYPE
        value: sqlite
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: APP_BASE_URL
        value: https://tracuuduoc-bvdktamduccauquan.com
      - key: CANONICAL_HOST
        value: tracuuduoc-bvdktamduccauquan.com
      # (TUỲ CHỌN) Mã bảo mật 6 số của cổng admin. KHÔNG bắt buộc: có thể để trống rồi thiết lập/đổi/lấy lại mã
      # ngay trên web (trang /admin lần đầu, menu "Mã bảo mật", hoặc "Quên mã bảo mật?" gửi qua email).
      # Đặt giá trị mới ở đây = đặt lại mã (mỗi giá trị chỉ áp dụng 1 lần) - dùng khi mất cả email lẫn mật khẩu.
      - key: ADMIN_GATE_PIN
        sync: false
